[package]
name = "pims"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "pims_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
